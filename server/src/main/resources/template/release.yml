name: Release

# Push a tag like v1.0.0 and this builds the plugin and publishes it as a release, so servers can run
# kiln install <you>/{{name}}.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: chmod +x gradlew && ./gradlew build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/{{name}}.jar --title "{{name}} ${GITHUB_REF_NAME#v}" --generate-notes
