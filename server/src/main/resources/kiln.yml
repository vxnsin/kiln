# Kiln server settings

# Your server's name and colors, shown in front of chat messages and on disconnect screens.
name: Kiln
colors:
  from: "#ff8700"
  to: "#ffd700"

# Address and port Minecraft connects to. 0.0.0.0 listens on every network interface.
host: 0.0.0.0
port: 25565

# true: only paid Minecraft accounts can join and skins work. Use false only on a closed LAN or behind a proxy.
online-mode: true

# Behind a Velocity proxy: put the forwarding secret of the proxy here (Velocity's "modern" forwarding).
# Players then have to come through the proxy and online-mode above is ignored. Empty: no proxy.
velocity-secret: ""

# Text in the server list (MiniMessage).
motd: "<gradient:#ff8700:#ffd700><bold>A Kiln server</bold></gradient><newline><gray>fresh out of the oven</gray>"

# Text in the server list while maintenance is on (/kiln maintenance on).
maintenance-motd: "<gradient:#ff8700:#ffd700><bold>Under maintenance</bold></gradient><newline><gray>back soon</gray>"

# Number shown as the player limit in the server list.
max-players: 100

# Language for plugin texts when a player's client language has no translation (two letters, like en or de).
language: en

# The world players land in when no plugin gives them one.
#   flat   an endless flat grass world, enough to stand on and test
#   none   plugins must set a spawning instance themselves
#   name   a world folder in worlds/, for example one saved in singleplayer (read-only, never written back)
world: flat

# Swap a plugin as soon as its jar in plugins/ changes, load new jars and unload removed ones.
# Handy while developing; turn it off if you would rather decide yourself with kiln reload.
watch-plugins: true

# Where plugin data and player data live.
#   files    JSON files in data/, nothing to set up
#   redis    Redis, Valkey or Dragonfly; share data between servers
#   mongodb  MongoDB, one collection per plugin table
storage:
  type: files
  redis: "redis://localhost:6379"
  mongodb: "mongodb://localhost:27017/kiln"

# This server's name among other Kiln servers sharing the same Redis. Empty: the machine or container name.
server-id: ""

# A resource pack for every player. Drop pack.zip next to the server and it is sent on join; no file, no pack.
resource-pack:
  file: pack.zip
  # Address players download it from. Empty: the LAN address of this machine. Put your public address or
  # domain here when players connect over the internet, and open the port in your firewall.
  host: ""
  port: 8164
  # Serve the pack from somewhere else instead, e.g. a CDN. The file there must be exactly the local one.
  public-url: ""
  # true: players who decline the pack cannot join.
  required: false
  prompt: ""

# Port of a small HTTP endpoint for container platforms: GET /health answers 200 once the server takes players
# and 503 before that, with player counts as JSON. 0 turns it off.
health-port: 0

# Shut down this many seconds after the last player left, for servers that live for one round. 0 keeps it running.
stop-when-empty: 0

# Every option above can also come from an environment variable: KILN_ plus the name in capitals with
# underscores, for example KILN_PORT=25566 or KILN_COLORS_FROM=#ff0000. The variable wins over this file.
