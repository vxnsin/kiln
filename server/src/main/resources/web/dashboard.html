<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#262a33; --text:#e8e8ea; --dim:#8b8f99; --hot:#ff8700; --warm:#ffd700; --ok:#5fd787; --bad:#ff5f57; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:28px 16px 48px; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  header svg { width:40px; height:40px; image-rendering:pixelated; flex:none; }
  h1 { margin:0; font-size:20px; letter-spacing:.2px; }
  .sub { color:var(--dim); font-size:13px; }
  .live { margin-left:auto; color:var(--dim); font-size:13px; display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .dot.on { background:var(--ok); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .value { font-size:26px; font-weight:650; margin-top:4px; font-variant-numeric:tabular-nums; }
  .value small { font-size:14px; color:var(--dim); font-weight:400; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin-top:10px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--hot),var(--warm)); transition:width .4s; }
  canvas { width:100%; height:48px; margin-top:8px; display:block; }
  h2 { font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin:28px 0 10px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:9px 0; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  td.num { text-align:right; color:var(--dim); width:150px; }
  td.share { width:40%; padding-left:16px; }
  .empty { color:var(--dim); padding:10px 0; }
  footer { margin-top:32px; color:var(--dim); font-size:12px; }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="0" width="1" height="1" fill="#d7875f"/><rect x="4" y="0" width="1" height="1" fill="#d7875f"/><rect x="5" y="0" width="1" height="1" fill="#d7875f"/><rect x="6" y="0" width="1" height="1" fill="#d7875f"/><rect x="2" y="1" width="1" height="1" fill="#d7875f"/><rect x="3" y="1" width="1" height="1" fill="#af5f5f"/><rect x="4" y="1" width="1" height="1" fill="#d7875f"/><rect x="5" y="1" width="1" height="1" fill="#d7875f"/><rect x="6" y="1" width="1" height="1" fill="#af5f5f"/><rect x="7" y="1" width="1" height="1" fill="#d7875f"/><rect x="1" y="2" width="1" height="1" fill="#d7875f"/><rect x="2" y="2" width="1" height="1" fill="#d7875f"/><rect x="3" y="2" width="1" height="1" fill="#d7875f"/><rect x="4" y="2" width="1" height="1" fill="#d7875f"/><rect x="5" y="2" width="1" height="1" fill="#d7875f"/><rect x="6" y="2" width="1" height="1" fill="#d7875f"/><rect x="7" y="2" width="1" height="1" fill="#d7875f"/><rect x="8" y="2" width="1" height="1" fill="#d7875f"/><rect x="1" y="3" width="1" height="1" fill="#d7875f"/><rect x="2" y="3" width="1" height="1" fill="#af5f5f"/><rect x="3" y="3" width="1" height="1" fill="#d7875f"/><rect x="4" y="3" width="1" height="1" fill="#5f0000"/><rect x="5" y="3" width="1" height="1" fill="#5f0000"/><rect x="6" y="3" width="1" height="1" fill="#d7875f"/><rect x="7" y="3" width="1" height="1" fill="#af5f5f"/><rect x="8" y="3" width="1" height="1" fill="#d7875f"/><rect x="1" y="4" width="1" height="1" fill="#d7875f"/><rect x="2" y="4" width="1" height="1" fill="#d7875f"/><rect x="3" y="4" width="1" height="1" fill="#5f0000"/><rect x="4" y="4" width="1" height="1" fill="#ff8700"/><rect x="5" y="4" width="1" height="1" fill="#ff8700"/><rect x="6" y="4" width="1" height="1" fill="#5f0000"/><rect x="7" y="4" width="1" height="1" fill="#d7875f"/><rect x="8" y="4" width="1" height="1" fill="#d7875f"/><rect x="1" y="5" width="1" height="1" fill="#d7875f"/><rect x="2" y="5" width="1" height="1" fill="#d7875f"/><rect x="3" y="5" width="1" height="1" fill="#5f0000"/><rect x="4" y="5" width="1" height="1" fill="#ffd700"/><rect x="5" y="5" width="1" height="1" fill="#ffd700"/><rect x="6" y="5" width="1" height="1" fill="#5f0000"/><rect x="7" y="5" width="1" height="1" fill="#d7875f"/><rect x="8" y="5" width="1" height="1" fill="#d7875f"/><rect x="1" y="6" width="1" height="1" fill="#d7875f"/><rect x="2" y="6" width="1" height="1" fill="#af5f5f"/><rect x="3" y="6" width="1" height="1" fill="#5f0000"/><rect x="4" y="6" width="1" height="1" fill="#ffd700"/><rect x="5" y="6" width="1" height="1" fill="#ffd700"/><rect x="6" y="6" width="1" height="1" fill="#5f0000"/><rect x="7" y="6" width="1" height="1" fill="#af5f5f"/><rect x="8" y="6" width="1" height="1" fill="#d7875f"/><rect x="1" y="7" width="1" height="1" fill="#d7875f"/><rect x="2" y="7" width="1" height="1" fill="#d7875f"/><rect x="3" y="7" width="1" height="1" fill="#5f0000"/><rect x="4" y="7" width="1" height="1" fill="#ff8700"/><rect x="5" y="7" width="1" height="1" fill="#ff8700"/><rect x="6" y="7" width="1" height="1" fill="#5f0000"/><rect x="7" y="7" width="1" height="1" fill="#d7875f"/><rect x="8" y="7" width="1" height="1" fill="#d7875f"/><rect x="0" y="8" width="1" height="1" fill="#6c6c6c"/><rect x="1" y="8" width="1" height="1" fill="#6c6c6c"/><rect x="2" y="8" width="1" height="1" fill="#6c6c6c"/><rect x="3" y="8" width="1" height="1" fill="#6c6c6c"/><rect x="4" y="8" width="1" height="1" fill="#6c6c6c"/><rect x="5" y="8" width="1" height="1" fill="#6c6c6c"/><rect x="6" y="8" width="1" height="1" fill="#6c6c6c"/><rect x="7" y="8" width="1" height="1" fill="#6c6c6c"/><rect x="8" y="8" width="1" height="1" fill="#6c6c6c"/><rect x="9" y="8" width="1" height="1" fill="#6c6c6c"/><rect x="1" y="9" width="1" height="1" fill="#6c6c6c"/><rect x="2" y="9" width="1" height="1" fill="#6c6c6c"/><rect x="3" y="9" width="1" height="1" fill="#6c6c6c"/><rect x="4" y="9" width="1" height="1" fill="#6c6c6c"/><rect x="5" y="9" width="1" height="1" fill="#6c6c6c"/><rect x="6" y="9" width="1" height="1" fill="#6c6c6c"/><rect x="7" y="9" width="1" height="1" fill="#6c6c6c"/><rect x="8" y="9" width="1" height="1" fill="#6c6c6c"/></svg>
    <div><h1 id="name">Kiln</h1><div class="sub" id="meta">connecting</div></div>
    <div class="live"><span class="dot" id="dot"></span><span id="state">offline</span></div>
  </header>
  <div class="grid">
    <div class="card"><div class="label">Ticks</div><div class="value" id="tps">-</div><div class="sub">time per tick, last 2 minutes</div><canvas id="chart"></canvas></div>
    <div class="card"><div class="label">Time per tick</div><div class="value" id="mspt">-</div><div class="bar"><i id="msptBar"></i></div></div>
    <div class="card"><div class="label">Players</div><div class="value" id="players">-</div><div class="bar"><i id="playersBar"></i></div></div>
    <div class="card"><div class="label">Memory</div><div class="value" id="memory">-</div><div class="bar"><i id="memoryBar"></i></div></div>
    <div class="card"><div class="label">CPU</div><div class="value" id="cpu">-</div><div class="sub" id="threads"></div></div>
    <div class="card"><div class="label">World</div><div class="value" id="chunks">-</div><div class="sub" id="world"></div></div>
  </div>
  <h2>Plugins, time per tick</h2>
  <table id="plugins"></table>
  <footer>Kiln <span id="version"></span> · <a href="https://github.com/vxnsin/kiln">github.com/vxnsin/kiln</a> · <a href="stats">stats as JSON</a></footer>
</main>
<script>
const $ = id => document.getElementById(id);
const history = [];
function draw() {
  const canvas = $("chart"), ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio; canvas.height = canvas.clientHeight * ratio;
  const g = canvas.getContext("2d"), w = canvas.width, h = canvas.height;
  const top = Math.max(1, ...history) * 1.3, step = w / 59, y = v => h - 2 * ratio - (h - 4 * ratio) * v / top;
  g.clearRect(0, 0, w, h);
  if (history.length < 2) return;
  const x = i => w - (history.length - 1 - i) * step;
  const fill = g.createLinearGradient(0, 0, 0, h);
  fill.addColorStop(0, "rgba(255,135,0,.35)"); fill.addColorStop(1, "rgba(255,135,0,0)");
  g.beginPath(); g.moveTo(x(0), h);
  history.forEach((v, i) => g.lineTo(x(i), y(v)));
  g.lineTo(w, h); g.closePath(); g.fillStyle = fill; g.fill();
  g.beginPath(); history.forEach((v, i) => i ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v)));
  g.strokeStyle = "#ff8700"; g.lineWidth = 2 * ratio; g.stroke();
}
function plural(n, one, many) { return n + " " + (n === 1 ? one : many || one + "s"); }
function bar(id, share) { $(id).style.width = Math.min(100, Math.max(0, share * 100)) + "%"; }
function uptime(s) { return s >= 3600 ? Math.floor(s / 3600) + " h " + Math.floor(s % 3600 / 60) + " min" : s >= 60 ? Math.floor(s / 60) + " min" : s + " s"; }
async function refresh() {
  try {
    const s = await (await fetch("stats", { cache: "no-store" })).json();
    document.title = s.name === "Kiln" ? "Kiln" : s.name + " · Kiln";
    $("name").textContent = s.name; $("version").textContent = s.version;
    $("meta").textContent = s.serverId + " · up " + uptime(s.uptimeSeconds) + (s.ready ? "" : " · starting");
    $("dot").className = "dot on"; $("state").textContent = "live";
    $("tps").innerHTML = s.ticksPerSecond < 0 ? "-" : s.ticksPerSecond.toFixed(1) + " <small>per second</small>";
    $("mspt").innerHTML = s.averageMillis.toFixed(1) + " <small>ms · peak " + s.peakMillis.toFixed(1) + "</small>";
    bar("msptBar", s.averageMillis / 50);
    $("players").innerHTML = s.players + " <small>of " + s.maxPlayers + "</small>"; bar("playersBar", s.players / s.maxPlayers);
    $("memory").innerHTML = s.usedMegabytes + " <small>MB of " + s.maxMegabytes + "</small>"; bar("memoryBar", s.usedMegabytes / s.maxMegabytes);
    $("cpu").innerHTML = s.cpuShare < 0 ? "-" : Math.round(s.cpuShare * 100) + " <small>% of " + s.cores + " cores</small>";
    $("threads").textContent = s.threads + " threads";
    $("chunks").innerHTML = s.chunks + " <small>chunks</small>";
    $("world").textContent = plural(s.instances, "instance") + " · " + plural(s.entities, "entity", "entities");
    history.push(s.averageMillis); if (history.length > 60) history.shift(); draw();
    const rows = s.plugins.map(p => { const share = p.millisPerTick / 50;
      return "<tr><td>" + p.name.replace(/[<&]/g, "") + "</td><td class=share><div class=bar><i style='width:" + Math.min(100, share * 100 * 5) + "%'></i></div></td><td class=num>" + p.millisPerTick.toFixed(3) + " ms · " + (share * 100).toFixed(1) + " %</td></tr>"; });
    $("plugins").innerHTML = rows.length ? rows.join("") : "<tr><td class=empty>No plugins loaded</td></tr>";
  } catch (e) {
    $("dot").className = "dot"; $("state").textContent = "offline";
  }
}
refresh(); setInterval(refresh, 2000); addEventListener("resize", draw);
</script>
</body>
</html>
